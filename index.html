<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pac-Man Hardcore Edition</title>
    <style>
        body {
            background-color: #111;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
            height: 100vh;
        }
        #ui-container {
            display: flex;
            gap: 20px;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 0 0 10px red;
        }
        #game-wrapper {
            position: relative;
            border: 4px solid #333;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
        }
        canvas {
            background: black;
            display: block;
        }
        /* Commandes Mobiles */
        #controls {
            margin-top: 15px;
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 10px;
        }
        .btn {
            background: #222;
            border: 2px solid #555;
            color: white;
            font-size: 24px;
            font-weight: bold;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            cursor: pointer;
        }
        .btn:active {
            background: red;
            border-color: white;
        }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }
    </style>
</head>
<body>

    <div id="ui-container">
        <div>SCORE: <span id="score">0</span></div>
        <div style="color: #ff3333;">NIVEAU: <span id="level">1</span>/5</div>
        <div>VIES: <span id="lives">3</span></div>
    </div>

    <div id="game-wrapper">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div id="controls">
        <div class="btn" id="btn-up">↑</div>
        <div class="btn" id="btn-left">←</div>
        <div class="btn" id="btn-right">→</div>
        <div class="btn" id="btn-down">↓</div>
    </div>

    <script src="game.js"></script>
</body>
</html>
